{% extends 'manager/index.html' %}
{% block title %}予約カレンダー{% endblock %}
{% block page_title %}シフト設定{% endblock %}
{% load lookup %}

{% block content %}
  <h2>{{ date }} の必要人数設定</h2>
  <form method="post">
    {% csrf_token %}
    <table class="table">
      <thead>
        <tr>
          <th>時間帯</th>
          <th>必要人数</th>
        </tr>
      </thead>
      <tbody>
        {% for slot in time_slots %}
        <tr>
          <td>{{ slot }}</td>
          <td>
            <input
              type="number"
              name="slot_{{ forloop.counter0 }}"
              min="0"
              value="{{ existing|lookup:slot|default_if_none:'' }}"
              class="form-control form-control-sm"
            >
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="d-flex justify-content-between">
      <a href="{% url 'calendar_admin_view' %}"
         class="btn btn-outline-secondary">
        ← 戻る
      </a>
      <button type="submit" class="btn btn-primary">
        保存
      </button>
    </div>
  </form>
{% endblock %}
